# Replace both values with the ones shown when you import the repo in SonarQube Cloud
sonar.organization=yash-khandagale
sonar.projectKey=yash-khandagale_localnestbyyash

sonar.sources=src
sonar.tests=src/lib/__tests__
sonar.test.inclusions=src/lib/__tests__/**
sonar.exclusions=**/node_modules/**,**/.next/**,**/coverage/**
sonar.cpd.exclusions=**/mockData.ts,**/i18n.ts
# UI has no automated tests yet; remove this line once Playwright/component tests exist
sonar.coverage.exclusions=src/components/**,src/app/**,src/styles/**,**/mockData.ts,**/i18n.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
